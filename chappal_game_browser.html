<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mom vs Son — Dungeon Chappal Chase</title>
<style>
:root{--bg:#0c1020;--panel:#171d31;--line:#38425f;--gold:#ffd166;--cyan:#55ddff;--red:#ff637d;--green:#76f2a3;--text:#f4f6ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202a46,#0c1020 65%);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}
main{width:min(1120px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px;padding:0 4px}h1{font-size:clamp(18px,3vw,28px);margin:0;letter-spacing:.04em}h1 span{color:var(--gold)}.sub{font-size:12px;color:#aab4d0}#gameWrap{position:relative;border:1px solid #46516f;border-radius:14px;overflow:hidden;box-shadow:0 18px 70px #0008;background:#111729}canvas{display:block;width:100%;height:auto;aspect-ratio:1100/760;outline:none}#help{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;color:#aab4d0;font-size:12px;padding:10px 4px}.pill{background:#1a2137;border:1px solid #303b58;border-radius:8px;padding:7px 10px}button{cursor:pointer;border:1px solid #72819f;background:#273653;color:white;border-radius:9px;padding:9px 14px;font-weight:700}button:hover{filter:brightness(1.15)}
</style></head>
<body><main>
<header><div><h1><span>⚡ MOM VS SON</span> — DUNGEON CHASE</h1><div class="sub">Browser edition · No downloads or extra libraries required</div></div><button id="restart">Restart game</button></header>
<div id="gameWrap"><canvas id="game" width="1100" height="760" tabindex="0" aria-label="Mom vs Son dungeon chase game"></canvas></div>
<div id="help"><div class="pill"><b style="color:var(--red)">MOM</b> WASD move · Q jump · hold C to charge power · hold V to adjust angle · TAB throw</div><div class="pill"><b style="color:var(--cyan)">SON</b> Arrow keys move · Right Shift jump · / boost</div><div class="pill">Survive 4 minutes · Son has 3 lives · Shield blocks one chappal</div></div>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=1100,H=760,VW=540,VH=455,WORLD_W=2200,WORLD_H=1400,GAME_TIME=240,THROW_CD=30,BOOST_CD=20;
const C={bg:'#101522',floor1:'#20283a',floor2:'#252e42',white:'#f4f6ff',gold:'#ffd166',red:'#ff637d',cyan:'#55ddff',green:'#76f2a3',purple:'#bda0ff'};
let state='menu',keys=new Set(),prev=new Set(),lastTick=performance.now(),startTime=0,elapsed=0,notice='',noticeUntil=0;
let mom,son,obstacles=[],traps=[],tiles=[],coins=[],shields=[],torches=[],shots=[],particles=[],texts=[];
let camM=[0,0],camS=[0,0],power=50,angle=0,aiming=false,aimStarted=0,lastThrow=-999,boostReady=0,boostUntil=0,screenShake=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1),rand=(a,b)=>a+Math.random()*(b-a);
function say(s,t=1.7){notice=s;noticeUntil=performance.now()/1000+t}
function burst(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=rand(35,190),life=rand(.25,.65);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,color,size:rand(2,4)})}}
function floatText(x,y,s,color=C.gold){texts.push({x,y,s,color,life:.9})}
function makeWorld(){
 obstacles=[];for(const [x,y,w,h] of [[360,130,140,65],[650,310,75,170],[980,130,180,65],[1280,300,85,170],[1580,160,170,70],[1880,410,85,180],[250,600,180,65],[600,790,85,160],[950,650,180,70],[1300,900,170,65],[1640,1050,180,70],[1950,850,85,170],[400,1120,160,70],[850,1120,150,65]])obstacles.push({x,y,w,h,kind:'wall'});
 traps=[[520,420],[850,500],[1450,430],[1750,730],[750,990],[1150,1200]].map(([x,y])=>({x,y,w:54,h:54,bx:x,by:y,phase:Math.random()*6.28,kind:'trap'}));
 tiles=[[300,300],[345,300],[390,300],[780,700],[825,700],[870,700],[1450,230],[1495,230],[1540,230],[1730,920],[1775,920],[1820,920],[520,850],[565,850],[610,850],[1100,1050],[1145,1050]].map(([x,y])=>({x,y,w:35,h:35,state:'ready',t:0}));
 coins=[[250,220],[550,220],[800,240],[1100,260],[1400,260],[1700,300],[2000,300],[300,500],[500,700],[800,900],[1100,800],[1400,750],[1700,1100],[2000,1200],[700,1250],[1200,500],[1550,600]].map(([x,y])=>({x,y,taken:false}));
 shields=[[720,570],[1510,830],[1900,600]].map(([x,y])=>({x,y,taken:false}));
 torches=[[90,100],[600,150],[900,220],[1250,120],[1750,180],[2100,150],[150,720],[750,620],[1150,650],[1550,950],[2050,1150],[450,1250]].map(([x,y])=>({x,y,phase:Math.random()*6.28}));
}
function box(p,x=p.x,y=p.y){return{x:x-p.r,y:y-p.r,w:p.r*2,h:p.r*2}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function blocked(p,x,y,ignoreJump=false){let r=p.r;if(x<r+2||y<r+2||x>WORLD_W-r-2||y>WORLD_H-r-2)return true;if(p.jump>0&&!ignoreJump)return false;let b=box(p,x,y);return obstacles.concat(traps).some(o=>overlap(b,o))}
function safePosition(p,x,y){for(let radius=0;radius<1000;radius+=20){for(let a=0;a<Math.PI*2;a+=Math.PI/8){let nx=clamp(x+Math.cos(a)*radius,p.r+4,WORLD_W-p.r-4),ny=clamp(y+Math.sin(a)*radius,p.r+4,WORLD_H-p.r-4);if(!blocked(p,nx,ny,true))return[nx,ny]}}return[120,180]}
function reset(){makeWorld();mom={x:120,y:180,r:17,stun:0,jump:0,coins:0,shield:false,lastBonk:-5};son={x:220,y:180,r:15,stun:0,jump:0,lives:3,coins:0,shield:false,lastBonk:-5};[mom.x,mom.y]=safePosition(mom,mom.x,mom.y);[son.x,son.y]=safePosition(son,son.x,son.y);if(dist(mom.x,mom.y,son.x,son.y)<70)[son.x,son.y]=safePosition(son,mom.x+110,mom.y+20);power=50;angle=0;aiming=false;aimStarted=0;lastThrow=-999;boostReady=0;boostUntil=0;shots=[];particles=[];texts=[];elapsed=0;startTime=performance.now()/1000;state='playing';keys.clear();prev.clear();say('THE CHASE BEGINS!',2);updateCameras()}
function move(p,dx,dy,dt,isMom){if(p.stun>0){p.stun=Math.max(0,p.stun-dt);return}if(isMom&&aiming)return;let speed=isMom?205:230;if(!isMom&&performance.now()/1000<boostUntil)speed=270;let l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;let nx=p.x+dx*speed*dt,ny=p.y+dy*speed*dt,hit=false;if(!blocked(p,nx,p.y))p.x=nx;else hit=true;if(!blocked(p,p.x,ny))p.y=ny;else hit=true;if(hit&&performance.now()/1000-p.lastBonk>1.2){p.lastBonk=performance.now()/1000;p.stun=1;burst(p.x,p.y,C.red,10);floatText(p.x,p.y-25,'BONK! 1s',C.red);say('OBSTACLE HIT!',1.2)} }
function jump(p){if(p.jump<=0&&p.stun<=0){p.jump=.55;burst(p.x,p.y+8,C.cyan,5)}}
function throwSandal(){let now=performance.now()/1000;if(now-lastThrow<THROW_CD){say(`CHAPPAL RECHARGING: ${Math.ceil(THROW_CD-(now-lastThrow))}s`,1);return}let direct=Math.atan2(son.y-mom.y,son.x-mom.x),a=direct+angle*Math.PI/180,v=270+power*2.5;shots.push({x:mom.x,y:mom.y-4,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:3,spin:0});lastThrow=now;burst(mom.x,mom.y,C.gold,7);say('CHAPPAL AWAY!',.9)}
function updateWorld(dt,now){for(const t of traps){t.x=t.bx+Math.sin(now*1.5+t.phase)*65;t.y=t.by+Math.cos(now*1.1+t.phase)*30}for(const tile of tiles){if(tile.state==='falling'){tile.t-=dt;if(tile.t<=0){tile.state='gone';tile.t=2.5}}else if(tile.state==='gone'){tile.t-=dt;if(tile.t<=0)tile.state='ready'}}}
function collect(p){for(const c of coins)if(!c.taken&&dist(p.x,p.y,c.x,c.y)<25){c.taken=true;p.coins++;burst(c.x,c.y,C.gold,9);floatText(c.x,c.y-12,'+1 COIN',C.gold)}for(const s of shields)if(!s.taken&&dist(p.x,p.y,s.x,s.y)<26){s.taken=true;p.shield=true;burst(s.x,s.y,C.cyan,15);floatText(s.x,s.y-14,'SHIELD!',C.cyan)}}
function updateShots(dt){for(const s of [...shots]){s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=90*dt;s.spin+=dt*18;s.life-=dt;if(dist(s.x,s.y,son.x,son.y)<son.r+10){shots.splice(shots.indexOf(s),1);if(son.shield){son.shield=false;burst(son.x,son.y,C.cyan,20);say('SHIELD BLOCKED THE CHAPPAL!',1.2)}else{son.lives--;son.stun=.45;screenShake=9;burst(son.x,son.y,C.red,24);floatText(son.x,son.y-25,`HIT! ${son.lives} LEFT`,C.red);say('DIRECT HIT!',1);if(son.lives<=0)end('MOM WINS!','Son was hit three times!')}continue}if(s.life<=0||s.x<0||s.y<0||s.x>WORLD_W||s.y>WORLD_H)shots.splice(shots.indexOf(s),1)}}
function end(title,sub){state='over';notice=title;noticeUntil=Infinity;endSubtitle=sub;burst((mom.x+son.x)/2,(mom.y+son.y)/2,C.gold,55)}let endSubtitle='';
function updateCameras(){camM=[clamp(mom.x-VW/2,0,WORLD_W-VW),clamp(mom.y-VH/2,0,WORLD_H-VH)];camS=[clamp(son.x-VW/2+45,0,WORLD_W-VW),clamp(son.y-VH/2,0,WORLD_H-VH)]}
function update(dt){let now=performance.now()/1000;if(state==='playing'){elapsed=now-startTime;updateWorld(dt,now);let mdx=(keys.has('d')?1:0)-(keys.has('a')?1:0),mdy=(keys.has('s')?1:0)-(keys.has('w')?1:0);move(mom,mdx,mdy,dt,true);let sdx=(keys.has('arrowright')?1:0)-(keys.has('arrowleft')?1:0),sdy=(keys.has('arrowdown')?1:0)-(keys.has('arrowup')?1:0);if(!aiming)move(son,sdx,sdy,dt,false);else if(now-aimStarted>4){aiming=false;say('AIM TIME EXPIRED!',.8)}
 // Holding C charges power; holding V adjusts the angle slowly. Both freeze Son while aiming.
 if(keys.has('c')){aiming=true;if(!aimStarted)aimStarted=now;power=clamp(power+dt*18,10,100)}if(keys.has('v')){aiming=true;if(!aimStarted)aimStarted=now;angle=clamp(angle+dt*36,-65,65)}if(!keys.has('c')&&!keys.has('v')){aiming=false;aimStarted=0}
 for(const p of [mom,son]){if(p.jump>0)p.jump=Math.max(0,p.jump-dt);for(const tile of tiles)if(tile.state==='ready'&&overlap(box(p),tile)){tile.state='falling';tile.t=.45;burst(tile.x+15,tile.y+15,C.gold,5)}collect(p);if(blocked(p,p.x,p.y,true)){[p.x,p.y]=safePosition(p,p.x,p.y);p.stun=.15}}
 updateShots(dt);if(dist(mom.x,mom.y,son.x,son.y)<27&&mom.stun<=0&&son.stun<=0)end('MOM WINS!','Mom caught Son!');if(elapsed>=GAME_TIME&&state==='playing')end('SON WINS!','Son survived for four minutes!');updateCameras()}
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const t of texts){t.y-=35*dt;t.life-=dt}texts=texts.filter(t=>t.life>0);screenShake=Math.max(0,screenShake-dt*18)}
function roundedRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function drawWorld(vx,cam,label){ctx.save();ctx.beginPath();ctx.rect(vx,0,VW,VH);ctx.clip();ctx.fillStyle='#171c2b';ctx.fillRect(vx,0,VW,VH);let step=50;for(let x=Math.floor(cam[0]/step)*step;x<cam[0]+VW+step;x+=step)for(let y=Math.floor(cam[1]/step)*step;y<cam[1]+VH+step;y+=step){ctx.fillStyle=((x/step+y/step)%2===0)?C.floor1:C.floor2;ctx.fillRect(vx+x-cam[0],y-cam[1],step-1,step-1)}
 for(const t of tiles){if(t.state==='gone')continue;let x=vx+t.x-cam[0],y=t.y-cam[1];ctx.fillStyle=t.state==='ready'?'#66583e':'#aa6845';ctx.fillRect(x,y,t.w,t.h);ctx.strokeStyle=C.gold;ctx.strokeRect(x,y,t.w,t.h);if(t.state==='falling'){ctx.strokeStyle='#211b24';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+t.w,y+t.h);ctx.stroke()}}
 for(const o of obstacles.concat(traps)){let x=vx+o.x-cam[0],y=o.y-cam[1];if(x+o.w<vx||x>vx+VW||y+o.h<0||y>VH)continue;if(o.kind==='wall'){ctx.fillStyle='#444b61';ctx.fillRect(x,y,o.w,o.h);ctx.strokeStyle='#78829b';ctx.lineWidth=3;ctx.strokeRect(x,y,o.w,o.h);ctx.fillStyle='#606a82';ctx.fillRect(x+5,y+8,o.w-10,3)}else{ctx.fillStyle='#641f3b';ctx.strokeStyle=C.red;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x+o.w/2,y+o.h/2,o.w/2,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#ff9c7a';ctx.font='bold 27px sans-serif';ctx.textAlign='center';ctx.fillText('✹',x+o.w/2,y+o.h/2+9)}}
 let now=performance.now()/1000;for(const t of torches){let x=vx+t.x-cam[0],y=t.y-cam[1];if(x<vx-30||x>vx+VW+30||y<-30||y>VH+30)continue;let f=Math.sin(now*8+t.phase)*2;for(const [r,col] of [[25+f,'#342b35'],[15+f,'#66432e'],[7+f,'#ff9e42']]){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}ctx.fillStyle='#a6a8b7';ctx.fillRect(x-2,y+7,4,14)}
 for(const c of coins)if(!c.taken){let x=vx+c.x-cam[0],y=c.y-cam[1];if(x<vx-12||x>vx+VW+12||y<-12||y>VH+12)continue;let r=7+Math.sin(now*6+c.x)*1.5;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=C.gold;ctx.fill();ctx.strokeStyle='#fff0a6';ctx.stroke();ctx.fillStyle='#8a4a15';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('$',x,y+4)}
 for(const s of shields)if(!s.taken){let x=vx+s.x-cam[0],y=s.y-cam[1];if(x<vx-20||x>vx+VW+20||y<-20||y>VH+20)continue;ctx.beginPath();ctx.arc(x,y,13,0,Math.PI*2);ctx.fillStyle='#173b56';ctx.fill();ctx.strokeStyle=C.cyan;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=C.cyan;ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('◆',x,y+6)}
 // Both characters are rendered in BOTH views; off-screen arrows indicate their direction.
 drawPlayer(mom,vx,cam,true);drawPlayer(son,vx,cam,false);drawShots(vx,cam);drawEffects(vx,cam);
 ctx.fillStyle='#101321aa';ctx.fillRect(vx,0,VW,18);ctx.fillStyle='#aab4d0';ctx.font='bold 10px system-ui';ctx.textAlign='left';ctx.fillText(label,vx+10,12);ctx.restore()}
function drawPlayer(p,vx,cam,isMom){let x=vx+p.x-cam[0],y=p.y-cam[1];if(x<vx-25||x>vx+VW+25||y<-30||y>VH+30){drawArrow(p,vx,cam,isMom);return}let lift=p.jump>0?Math.sin(p.jump/.55*Math.PI)*22:0,by=y-lift;if(!isMom&&performance.now()/1000<boostUntil){for(let i=1;i<=4;i++){ctx.strokeStyle=`rgba(85,221,255,${.45-i*.08})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,13+i*4,0,Math.PI*2);ctx.stroke()}}if(p.shield){ctx.strokeStyle=C.cyan;ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,by,25,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#080b12';ctx.beginPath();ctx.ellipse(x,y+8,18,7,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x,by,p.r,0,Math.PI*2);ctx.fillStyle=isMom?C.red:C.cyan;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=isMom?'#ffd5dc':'#d0f8ff';ctx.stroke();ctx.beginPath();ctx.arc(x,by-3,8,0,Math.PI*2);ctx.fillStyle='#ffe0c1';ctx.fill();ctx.fillStyle='#20202a';ctx.beginPath();ctx.arc(x-3,by-4,1.5,0,Math.PI*2);ctx.arc(x+3,by-4,1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=C.white;ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(isMom?'MOM':'SON',x,by-27);if(p.stun>0){ctx.fillStyle=C.gold;ctx.fillText('✦ ✦',x,by-40)}}
function drawArrow(p,vx,cam,isMom){let cx=vx+VW/2,cy=VH/2,tx=vx+p.x-cam[0],ty=p.y-cam[1],a=Math.atan2(ty-cy,tx-cx),r=220,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=isMom?C.red:C.cyan;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-8,-7);ctx.lineTo(-8,7);ctx.closePath();ctx.fill();ctx.restore();ctx.fillStyle=C.white;ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(isMom?'MOM':'SON',x,y-13)}
function drawShots(vx,cam){for(const s of shots){let x=vx+s.x-cam[0],y=s.y-cam[1];if(x<vx-20||x>vx+VW+20||y<-20||y>VH+20)continue;ctx.strokeStyle=C.gold;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x-s.vx*.06,y-s.vy*.06);ctx.lineTo(x,y);ctx.stroke();ctx.save();ctx.translate(x,y);ctx.rotate(s.spin);ctx.fillStyle='#a86e3d';ctx.strokeStyle='#ffe0a0';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(0,0,10,4,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}}
function drawEffects(vx,cam){for(const p of particles){let x=vx+p.x-cam[0],y=p.y-cam[1];if(x<vx-10||x>vx+VW+10||y<-10||y>VH+10)continue;ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(x,y,Math.max(1,p.size*p.life/p.max),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}for(const t of texts){let x=vx+t.x-cam[0],y=t.y-cam[1];if(x<vx-100||x>vx+VW+100||y<-40||y>VH+40)continue;ctx.globalAlpha=clamp(t.life,0,1);ctx.fillStyle=t.color;ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(t.s,x,y);ctx.globalAlpha=1}}
function drawAim(){if(!aiming||state!=='playing')return;let vx=10,cam=camM,x=vx+mom.x-cam[0],y=mom.y-cam[1],direct=Math.atan2(son.y-mom.y,son.x-mom.x),a=direct+angle*Math.PI/180,v=270+power*2.5;ctx.save();ctx.fillStyle=C.gold;for(let i=1;i<14;i++){let t=i*.065,px=x+Math.cos(a)*v*t,py=y+Math.sin(a)*v*t+45*t*t;if(px>vx&&px<vx+VW&&py>0&&py<VH){ctx.beginPath();ctx.arc(px,py,2.7,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function text(x,y,s,size,color,align='center'){ctx.fillStyle=color;ctx.font=`bold ${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function drawHud(){ctx.fillStyle='#171b2a';ctx.fillRect(0,0,W,44);text(20,28,'⚔ MOM VS SON',18,C.gold,'left');text(W-20,27,'DUNGEON CHASE',12,'#9ba6c2','right');roundedRect(10,HUD_Y=510,530,240,10,'#191e2e','#444b61');roundedRect(560,510,530,240,10,'#191e2e','#444b61');text(28,538,'MOM',16,C.red,'left');text(28,560,'Speed: 5 km/h',11,C.white,'left');text(28,582,`Power: ${Math.round(power)}%`,11,C.gold,'left');text(28,603,`Angle: ${Math.round(angle)}°`,11,C.gold,'left');let rem=Math.max(0,THROW_CD-(performance.now()/1000-lastThrow));text(28,626,rem<=0?'CHAPPAL READY!':`COOLDOWN: ${Math.ceil(rem)}s`,11,rem<=0?C.green:C.red,'left');text(28,649,'WASD move · Q jump · hold C/V to aim · TAB throw',10,'#aab3ca','left');text(28,671,`Coins: ${mom.coins}`,11,C.gold,'left');text(578,538,'SON',16,C.cyan,'left');text(578,560,'Speed: 6 km/h · Boost: 7 km/h',11,C.white,'left');text(578,583,`Lives: ${son.lives}/3`,12,C.red,'left');for(let i=0;i<3;i++){ctx.fillStyle=i<son.lives?C.red:'#41475a';ctx.beginPath();ctx.arc(720+i*22,578,7,0,Math.PI*2);ctx.fill()}let now=performance.now()/1000,boost=now<boostUntil?'BOOST ACTIVE!':now>=boostReady?'BOOST READY: /':`BOOST: ${Math.ceil(boostReady-now)}s`;text(578,608,boost,11,now<boostUntil||now>=boostReady?C.green:C.gold,'left');text(578,631,`Shield: ${son.shield?'ACTIVE':'none'} · Coins: ${son.coins}`,11,C.cyan,'left');text(578,654,'Arrows move · Right Shift jump · / boost',10,'#aab3ca','left');text(W/2,70,`${String(Math.floor(Math.max(0,GAME_TIME-elapsed)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,GAME_TIME-elapsed)%60)).padStart(2,'0')}`,20,C.gold);ctx.fillStyle='#343a4d';ctx.fillRect(W/2-115,84,230,7);ctx.fillStyle=GAME_TIME-elapsed>60?C.green:C.red;ctx.fillRect(W/2-115,84,230*clamp((GAME_TIME-elapsed)/GAME_TIME,0,1),7);if(notice&&performance.now()/1000<noticeUntil){roundedRect(W/2-200,100,400,30,7,'#252b3e','#5a647e');text(W/2,120,notice,12,C.gold)}if(aiming){roundedRect(W/2-150,140,300,42,7,'#191e2e','#5a647e');text(W/2,156,`AIMING — Power ${Math.round(power)}% · Angle ${Math.round(angle)}°`,11,C.gold);text(W/2,173,'Release C/V to finish aiming; TAB to throw',10,C.white)}}
function drawMenu(){ctx.fillStyle='#101321';ctx.fillRect(0,0,W,H);for(let x=0;x<W;x+=55)for(let y=0;y<H;y+=55){ctx.fillStyle=((x/55+y/55)%2)?'#171c2b':'#1b2132';ctx.fillRect(x,y,54,54)}text(W/2,155,'MOM VS SON',40,C.gold);text(W/2,205,'DUNGEON CHASE',24,C.cyan);text(W/2,250,'A split-screen arcade chase through a dangerous dungeon',14,C.white);roundedRect(W/2-320,285,640,250,12,'#171c2b','#5c6681');text(W/2,318,'HOW TO PLAY',17,C.gold);['MOM: WASD move · Q jump · hold C to charge power · hold V to change angle · TAB throw','SON: Arrow keys move · Right Shift jump · / boost','Son has 3 lives. Dodge chappals and avoid being caught.','Collect coins and shields. Jump over traps and obstacles.','Survive for 4 minutes to win. Chappal cooldown: 30 seconds.','Boost lasts 2.5 seconds and recharges every 20 seconds.'].forEach((s,i)=>text(W/2,354+i*27,s,11,C.white));roundedRect(W/2-155,565,310,54,10,'#2d4054',C.cyan);text(W/2,598,'PRESS ENTER TO START',16,C.white);text(W/2,655,'Browser edition · HTML Canvas · No extra packages',11,'#9ba6c2')}
function draw(){ctx.clearRect(0,0,W,H);if(state==='menu'){drawMenu();return}ctx.save();if(screenShake>0)ctx.translate(rand(-screenShake,screenShake),rand(-screenShake,screenShake));drawWorld(10,camM,'MOM CAMERA');drawWorld(550,camS,'SON CAMERA');ctx.restore();drawAim();drawHud();if(state==='over'){ctx.fillStyle='#090c16bb';ctx.fillRect(0,0,W,H);roundedRect(W/2-260,H/2-100,520,200,14,'#20263a',C.gold);text(W/2,H/2-40,notice,27,C.gold);text(W/2,H/2+2,endSubtitle,14,C.white);text(W/2,H/2+45,'Press ENTER to play again · ESC to quit',12,'#aab3ca')}}
function loop(ts){let dt=Math.min((ts-lastTick)/1000,.04);lastTick=ts;update(dt);draw();requestAnimationFrame(loop)}
function keyName(e){return e.key.toLowerCase()===' ' ? 'space':e.key.toLowerCase()}
window.addEventListener('keydown',e=>{let k=keyName(e);if(['tab','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if(k==='escape'){if(state==='playing'){state='menu';keys.clear()}else if(state==='menu'){state='menu'}return}if(state==='menu'){if(k==='enter'||k==='space')reset();return}if(state==='over'){if(k==='enter')reset();return}if(!keys.has(k)){if(k==='q')jump(mom);if(k==='shift')jump(son);if(k==='tab')throwSandal();if(k==='/'){let now=performance.now()/1000;if(now>=boostReady){boostUntil=now+2.5;boostReady=now+BOOST_CD;burst(son.x,son.y,C.cyan,16);say('SON BOOST ACTIVATED!',1)}else say(`BOOST READY IN ${Math.ceil(boostReady-now)}s`,1)}if(k==='v'&&!keys.has('v')){angle=clamp(angle+10,-65,65);aiming=true;aimStarted=performance.now()/1000}if(k==='c'&&!keys.has('c')){aiming=true;aimStarted=performance.now()/1000}}keys.add(k)});
window.addEventListener('keyup',e=>{let k=keyName(e);keys.delete(k);if(k==='c'||k==='v'){aiming=false;aimStarted=0}});window.addEventListener('blur',()=>{keys.clear();aiming=false;aimStarted=0});document.getElementById('restart').addEventListener('click',()=>{reset();canvas.focus()});canvas.addEventListener('click',()=>canvas.focus());
// C/V aiming can only last a short period; charging/angle controls work while held.
let HUD_Y=510;makeWorld();requestAnimationFrame(loop);
})();
</script></body></html>
